<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="x5-orientation" content="landscape">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-fullscreen" content="true">
  <meta name="full-screen" content="yes">
  <meta name="theme-color" content="#14100a">
  <meta name="description" content="奶龙大乱斗 · 奶娃九形态（慈爱/暗黑/愤怒/战斗/奶龙/空虚/温柔/神龙/忧郁），每种形态一套完全不同的招式！纯 HTML5 浏览器格斗小游戏，电脑键盘就能开打，手机横屏触控也能玩。">
  <meta property="og:title" content="奶龙大乱斗 · 宇宙最强龙杯 🐲">
  <meta property="og:description" content="奶娃九形态同台乱斗：专属弹幕 / 虚步穿人 / 多层平台，电脑浏览器直接开玩！">
  <meta property="og:image" content="https://duzhiwu612-byte.github.io/nailoong-brawl/share-cover.jpg">
  <meta property="og:type" content="website">
  <title>奶龙大乱斗 · 宇宙最强龙杯</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #14100a;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      display: block;
      background: #000;
      border-radius: 10px;
      box-shadow: 0 10px 60px rgba(0, 0, 0, 0.85), 0 0 0 4px rgba(255, 217, 59, 0.35);
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }
    #boot-tip {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #FFE066;
      font-size: 18px;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <div id="boot-tip">正在召唤奶龙…</div>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/render.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/fighter.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/main.js"></script>
  <script src="js/touch.js"></script>
  <script>
    // 启动后隐藏提示
    (function () {
      function hide() {
        var tip = document.getElementById('boot-tip');
        if (tip) tip.style.display = 'none';
      }
      if (window.NL && NL.boot) { hide(); }
      else { setTimeout(hide, 3000); }
    })();
  </script>
</body>
</html>
